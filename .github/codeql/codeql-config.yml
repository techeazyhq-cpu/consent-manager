name: consent-manager CodeQL
# Suppressions are allowed only when a finding does not apply, with the reason here (CONTRIBUTING.md).
query-filters:
  # Every backend service is a stateless OAuth2 resource server: requests are authenticated only by a bearer token in
  # the Authorization header, never by a cookie or a server-side session, so a cross-site request carries no
  # credentials and CSRF protection has nothing to protect. Spring Security's guidance is to disable it for such APIs.
  # Revisit if any service ever authenticates with cookies.
  - exclude:
      id: java/spring-disabled-csrf-protection
