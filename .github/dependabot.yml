version: 2
# Version-update pull requests are off: open-pull-requests-limit 0 stops them for every ecosystem. Dependabot security
# updates are separate (turned on in the repository's Code security settings), are not bound by this limit, and still
# open a pull request when an alert has a patched version. The entries stay so security updates know where each
# manifest lives and how to group.
updates:
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      spring: { applies-to: security-updates, patterns: ["org.springframework*"] }
      keycloak: { applies-to: security-updates, patterns: ["org.keycloak*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /infra/docker
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0
    groups:
      # init and analyze must be the same release: CodeQL refuses a configuration written by another version, so
      # updating them in separate pull requests fails both.
      codeql: { applies-to: security-updates, patterns: ["github/codeql-action*"] }
