name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependencies-and-secrets:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan the repository (dependencies, secrets, misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build for analysis
        if: matrix.language == 'java-kotlin'
        run: ./gradlew --no-daemon --no-build-cache compileJava compileTestJava
      # The repository is private and has no GitHub Advanced Security, so GitHub's code scanning cannot receive the
      # results. They are written as SARIF instead and any finding fails the job, which keeps CodeQL a gate. With
      # Advanced Security (or a public repository), set upload to "always" to get alerts in the Security tab too.
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: never
          output: codeql-results
      - name: Fail on any CodeQL finding
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            let findings = 0;
            for (const file of fs.readdirSync("codeql-results").filter(f => f.endsWith(".sarif"))) {
              const sarif = JSON.parse(fs.readFileSync(path.join("codeql-results", file), "utf8"));
              for (const run of sarif.runs) for (const result of run.results ?? []) {
                const where = result.locations?.[0]?.physicalLocation;
                console.log(`${result.ruleId}: ${where?.artifactLocation?.uri}:${where?.region?.startLine} ${result.message.text}`);
                findings++;
              }
            }
            console.log(`${findings} CodeQL finding(s)`);
            process.exit(findings === 0 ? 0 : 1);
          '
