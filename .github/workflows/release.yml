name: Release

# Publishes a version (ADR-072): the service images to GHCR, signed and scanned, and the Helm chart as an OCI artifact.
# Run by pushing a tag, for example `git tag v0.2.0 && git push origin v0.2.0`. Nothing is deployed from here: a deployment
# installs the published chart (docs/runbooks/release.md). The web apps are not published: Vite bakes each environment's
# gateway and Keycloak addresses into them (ADR-042), so each environment builds its own with infra/docker/Dockerfile.ui.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish images and chart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the GitHub release
      packages: write # GHCR
      id-token: write # keyless signing
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Work out the names
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "TAG=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Build the service JARs
        run: ./gradlew --no-daemon bootJar
      # An image is built, scanned, and only then pushed: a CRITICAL flaw with a fix stops the release before anything is published.
      - name: Build and scan each service image
        run: |
          : > images.txt
          for jar in backend/services/*/*-boot/build/libs/*.jar backend/services/cm-gw/build/libs/*.jar; do
            case "$jar" in *-plain.jar) continue ;; esac
            module=$(basename "$jar" -0.1.0-SNAPSHOT.jar)
            name="${module%-boot}"; case "$module" in cm-gw) ;; *) name="${name}-svc" ;; esac
            docker build -f infra/docker/Dockerfile.service --build-arg "JAR_PATH=$jar" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=${TAG}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              -t "${REGISTRY}/${name}:${TAG}" .
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
              aquasec/trivy:0.69.3 image --ignorefile /.trivyignore --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet \
              "${REGISTRY}/${name}:${TAG}" < /dev/null
            # what is in the image, as a CycloneDX bill of materials (ADR-086)
            mkdir -p sbom
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" aquasec/trivy:0.69.3 image \
              --format cyclonedx --output "/out/${name}.cdx.json" --quiet "${REGISTRY}/${name}:${TAG}" < /dev/null
            echo "${REGISTRY}/${name}:${TAG}" >> images.txt
          done
          cat images.txt
          test "$(wc -l < images.txt)" -eq 9
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push each image, sign it by digest, and attach its bill of materials and its provenance
        run: |
          : > digests.txt
          while read -r image; do
            docker push "$image"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            name=$(basename "${image%%:*}")
            cosign sign --yes "$digest"
            # what it contains, and where it came from: this workflow, this tag, this commit (ADR-086). Signed with the same
            # keyless identity, so a verifier can tell they were made by this repository's release workflow
            cosign attest --yes --type cyclonedx --predicate "sbom/${name}.cdx.json" "$digest"
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
              --arg server "$GITHUB_SERVER_URL" --arg wf "$GITHUB_WORKFLOW_REF" '{
                buildDefinition: {
                  buildType: ($server + "/" + $repo + "/release@v1"),
                  externalParameters: {workflow: $wf, ref: $ref},
                  resolvedDependencies: [{uri: ("git+" + $server + "/" + $repo + "@" + $ref), digest: {gitCommit: $sha}}]},
                runDetails: {
                  builder: {id: ($server + "/" + $wf)},
                  metadata: {invocationId: ($server + "/" + $repo + "/actions/runs/" + $run)}}}' > "provenance-${name}.json"
            cosign attest --yes --type slsaprovenance1 --predicate "provenance-${name}.json" "$digest"
            echo "$digest" >> digests.txt
          done < images.txt
          cat digests.txt
      - name: Package and push the Helm chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # one container does it all: helm keeps its registry login inside the container
          # shellcheck disable=SC2016 # the variables are the container's, not this shell's
          docker run --rm -i -e GHCR_TOKEN -e TAG -e REGISTRY -e ACTOR="${{ github.actor }}"             -v "$PWD/deploy/helm:/charts" -w /charts --entrypoint sh alpine/helm:3.16.4 -c '
              set -e
              helm lint consent-manager -f consent-manager/values-aws.yaml
              helm package consent-manager --version "$TAG" --app-version "$TAG" -d /tmp/dist
              echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
              helm push "/tmp/dist/consent-manager-$TAG.tgz" "oci://$REGISTRY/charts"
            '
      - name: Write the release notes
        run: |
          {
            echo "Images (signed with cosign, keyless; verify with \`cosign verify --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>\`):"
            echo
            sed 's/^/- `/; s/$/`/' digests.txt
            echo
            echo "Each image also has a CycloneDX bill of materials and a SLSA provenance statement attached as signed attestations"
            echo "(\`cosign verify-attestation --type cyclonedx <image> ...\`, \`--type slsaprovenance1\`), and the bills of materials are attached to this release."
            echo
            echo "Chart: \`oci://${REGISTRY}/charts/consent-manager\` version \`${TAG}\`."
          } > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --title "$VERSION" --notes-file notes.md --verify-tag sbom/*.cdx.json
