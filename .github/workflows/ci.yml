name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: License headers
        run: node scripts/license-headers.mjs
      - name: Check and unit-test the OPA authorisation policies
        run: >-
          docker run --rm -v "$PWD/infra/opa/policies:/policies:ro" openpolicyagent/opa:1.20.1 check /policies
          && docker run --rm -v "$PWD/infra/opa/policies:/policies:ro" openpolicyagent/opa:1.20.1 test /policies -v
      - name: Build, test (PostgreSQL integration tests need Docker), architecture rules and the coverage ratchet
        run: ./gradlew --no-daemon build coverageVerification
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-reports
          path: |
            **/build/reports/tests/
            build/reports/jacoco/coverageReport/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Install pnpm (the version the lockfile was written with)
        run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - name: Build the three micro-frontends
        run: pnpm -r build
      - name: Known vulnerabilities in runtime dependencies
        run: pnpm audit --prod --audit-level high

  images:
    name: Service images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build the service JARs
        run: ./gradlew --no-daemon bootJar
      - name: Build each service image
        run: |
          for jar in backend/services/*/build/libs/*.jar backend/services/*/*-boot/build/libs/*.jar; do
            case "$jar" in *-plain.jar) continue ;; esac
            name=$(basename "$jar" -0.1.0-SNAPSHOT.jar)
            docker build -f infra/docker/Dockerfile.service --build-arg "JAR_PATH=$jar" -t "cm/$name:ci" .
            echo "cm/$name:ci" >> images.txt
          done
          cat images.txt
      # Reported, not yet blocking: the services still bundle older Netty, Pulsar and Bouncy Castle
      # releases with known CRITICAL flaws. The dependency upgrade turns this into a gate (exit-code 1 on CRITICAL),
      # as notification-service has it.
      - name: Scan each image for known vulnerabilities (report only until the dependency upgrade)
        run: |
          for image in $(cat images.txt); do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
              aquasec/trivy:0.65.0 image \
              --severity CRITICAL --ignore-unfixed --exit-code 0 --quiet "$image" < /dev/null
            echo "::endgroup::"
          done
