name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: License headers
        run: node scripts/license-headers.mjs
      - name: Error dictionary
        run: node scripts/error-dictionary.mjs --check
      - name: AI ingestion guard unit tests (ADR-069)
        run: node --test sdk/ai-ingestion-guard/test/*.test.mjs
      - name: Consent sidecar unit tests (ADR-076)
        run: node --test sdk/pep-sidecar/test/*.test.mjs
      - name: Email deliverability checker unit tests (ADR-071)
        run: node --test scripts/email-deliverability.test.mjs
      - name: Check and unit-test the OPA authorisation policies
        run: >-
          docker run --rm -v "$PWD/infra/opa/policies:/policies:ro" openpolicyagent/opa:1.20.1 check /policies
          && docker run --rm -v "$PWD/infra/opa/policies:/policies:ro" openpolicyagent/opa:1.20.1 test /policies -v
      - name: Check the alert rules and unit-test those that have tests (ADR-092)
        run: >-
          docker run --rm --entrypoint sh -v "$PWD/infra/observability/prometheus/rules:/r:ro" prom/prometheus:v3.5.0
          -c 'promtool check rules /r/*.rules.yml && promtool test rules /r/tests/*.test.yml'
      - name: Build, test (PostgreSQL integration tests need Docker), architecture rules and the coverage ratchet
        run: ./gradlew --no-daemon build coverageVerification
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-reports
          path: |
            **/build/reports/tests/
            build/reports/jacoco/coverageReport/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install pnpm (the version the lockfile was written with)
        run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - name: Build the three micro-frontends
        run: pnpm -r build
      - name: Known vulnerabilities in runtime dependencies
        run: pnpm audit --prod --audit-level high

  images:
    name: Service images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build the service JARs
        run: ./gradlew --no-daemon bootJar
      - name: Build each service image
        run: |
          for jar in backend/services/*/build/libs/*.jar backend/services/*/*-boot/build/libs/*.jar; do
            case "$jar" in *-plain.jar) continue ;; esac
            name=$(basename "$jar" -0.1.0-SNAPSHOT.jar)
            docker build -f infra/docker/Dockerfile.service --build-arg "JAR_PATH=$jar" -t "cm/$name:ci" .
            echo "cm/$name:ci" >> images.txt
          done
          cat images.txt
      # A gate since the dependency upgrade (VAPT): a CRITICAL flaw with a fix fails the build, unless .trivyignore
      # accepts it with a reason and an expiry date. HIGH is reported.
      - name: Scan each image for known vulnerabilities
        run: |
          status=0
          for image in $(cat images.txt); do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
              -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:0.69.3 image --ignorefile /.trivyignore \
              --severity HIGH --ignore-unfixed --exit-code 0 --quiet "$image" < /dev/null
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
              -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:0.69.3 image --ignorefile /.trivyignore \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet "$image" < /dev/null || status=1
            echo "::endgroup::"
          done
          exit $status

  infrastructure:
    name: Infrastructure as code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Terraform format, validate and module tests (AWS, Azure, GCP)
        run: |
          docker run --rm -v "$PWD/deploy/terraform:/tf" -w /tf --entrypoint sh hashicorp/terraform:1.12.2 -ec '
            terraform fmt -check -recursive
            for d in aws/production azure/production gcp/production; do
              (cd $d && terraform init -backend=false -input=false >/dev/null && terraform validate)
            done
            for d in aws azure gcp; do
              (cd $d/modules/datastores && terraform init -backend=false -input=false >/dev/null && terraform test)
            done'
      - name: Helm lint, render for each cloud and the sandbox, and check against Kubernetes schemas
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          helm lint consent-manager -f consent-manager/values-aws.yaml
          for cloud in aws azure gcp; do
            helm template cm consent-manager -f consent-manager/values-$cloud.yaml > /tmp/$cloud.yaml
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas \
              -kubernetes-version 1.30.0 < /tmp/$cloud.yaml
          done
          helm template cm consent-manager -f consent-manager/values-gcp.yaml -f consent-manager/values-sandbox.yaml \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas
      - name: The database connection can be made to verify the server (ADR-085)
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          helm template cm consent-manager -f consent-manager/values-aws.yaml --set config.database.tls.mode=verify-full \
            --set config.database.tls.caConfigMap=rds-ca > /tmp/tls.yaml
          test "$(grep -c 'sslmode=verify-full&sslrootcert=/etc/db-ca/ca-bundle.pem' /tmp/tls.yaml)" -eq 7   # the migration connection of each service
          test "$(grep -c 'sslMode=VERIFY_FULL&sslRootCert=/etc/db-ca/ca-bundle.pem' /tmp/tls.yaml)" -eq 7   # and its queries
          test "$(grep -c 'name: rds-ca' /tmp/tls.yaml)" -eq 8   # mounted in the seven services and in the database-init job
      - name: The chart passes the invoice payment terms and reminder steps (ADR-105)
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          helm template cm consent-manager > /tmp/dun.yaml
          grep -q 'CM_BIL_PAYMENT_TERMS_DAYS, value: "14"' /tmp/dun.yaml
          grep -q 'CM_BIL_REMINDER_DAYS, value: "3,10,20"' /tmp/dun.yaml
          helm template cm consent-manager --set config.billing.paymentTermsDays=30 --set 'config.billing.reminderDays={7,14}' > /tmp/dun2.yaml
          grep -q 'CM_BIL_PAYMENT_TERMS_DAYS, value: "30"' /tmp/dun2.yaml
          grep -q 'CM_BIL_REMINDER_DAYS, value: "7,14"' /tmp/dun2.yaml
          helm template cm consent-manager --set config.billing.remindersEnabled=false | grep -q 'CM_BIL_REMINDER_DAYS, value: ""'   # off
      - name: The chart switches AI drafting on only with an endpoint and a model (ADR-111)
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          helm template cm consent-manager | grep -q 'CM_CNSCMD_AI_DRAFTING_ENABLED, value: "false"'   # off by default
          helm template cm consent-manager | grep -q 'CM_CNSCMD_AI_DRAFTING_ENDPOINT' && exit 1
          if helm template cm consent-manager --set config.aiDrafting.enabled=true >/dev/null 2>&1; then exit 1; fi   # no endpoint: refused
          helm template cm consent-manager --set config.aiDrafting.enabled=true --set config.aiDrafting.endpoint=http://m:11434             --set config.aiDrafting.model=llama3.1:8b --set config.aiDrafting.apiKeySecretKey=AI_DRAFTING_API_KEY > /tmp/ai.yaml
          grep -q 'CM_CNSCMD_AI_DRAFTING_ENDPOINT, value: "http://m:11434"' /tmp/ai.yaml
          grep -q 'CM_CNSCMD_AI_DRAFTING_API_KEY' /tmp/ai.yaml
      - name: Every cloud requires the sign-in service key, the base values do not (ADR-103)
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          for cloud in aws azure gcp; do
            helm template cm consent-manager -f consent-manager/values-$cloud.yaml > /tmp/k-cm.yaml
            helm template c common -f common/values-$cloud.yaml > /tmp/k-co.yaml
            for f in /tmp/k-cm.yaml /tmp/k-co.yaml; do
              grep -q 'key: NTF_INTERNAL_API_KEY}}' $f   # a reference with no optional: the pod does not start without it
              grep -q 'secretKey: NTF_INTERNAL_API_KEY' $f   # and the secret sync maps it
            done
          done
          for out in "$(helm template cm consent-manager)" "$(helm template c common)"; do
            echo "$out" | grep -q 'key: NTF_INTERNAL_API_KEY, optional: true}}'
          done
      - name: Keycloak can verify its database server (ADR-100)
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          helm template c common --set keycloak.database.tls.mode=verify-full --set keycloak.database.tls.caConfigMap=rds-ca > /tmp/kc.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 < /tmp/kc.yaml
          grep -q 'keycloak?sslmode=verify-full&sslrootcert=/etc/db-ca/ca-bundle.pem' /tmp/kc.yaml
          test "$(grep -c 'name: rds-ca' /tmp/kc.yaml)" -eq 1   # the bundle is mounted
          # unset, the URL has no options and there is no mount
          helm template c common > /tmp/kc0.yaml
          grep -q '"jdbc:postgresql://postgres:5432/keycloak"' /tmp/kc0.yaml
          test "$(grep -c 'db-ca' /tmp/kc0.yaml)" -eq 0
      - name: The services can reach a broker over TLS with a token (ADR-099)
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          helm template cm consent-manager -f consent-manager/values-aws.yaml --set config.pulsar.url=pulsar+ssl://broker:6651 \
            --set config.pulsar.tls.caConfigMap=pulsar-ca --set config.pulsar.tokenFromSecret=true > /tmp/pt.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 < /tmp/pt.yaml
          test "$(grep -c 'CM_PULSAR_TLS_TRUST_CERTS_FILE' /tmp/pt.yaml)" -eq 9
          test "$(grep -c 'name: CM_PULSAR_AUTH_TOKEN' /tmp/pt.yaml)" -eq 9
          test "$(grep -c 'name: pulsar-ca, mountPath: /etc/pulsar-ca' /tmp/pt.yaml)" -eq 9
          test "$(helm template cm consent-manager -f consent-manager/values-aws.yaml | grep -c 'pulsar-ca\|PULSAR_AUTH\|PULSAR_TLS')" -eq 0   # off unless asked for
      - name: The services can trust the cache server' + "'" + 's own CA (ADR-098)
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          helm template cm consent-manager -f consent-manager/values-gcp.yaml --set config.redis.tls.caConfigMap=redis-ca > /tmp/rc.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 < /tmp/rc.yaml
          test "$(grep -c 'SPRING_DATA_REDIS_SSL_BUNDLE' /tmp/rc.yaml)" -eq 3   # the gateway, the query service and billing use Redis
          test "$(grep -c 'name: redis-ca, mountPath: /etc/redis-ca' /tmp/rc.yaml)" -eq 3
          test "$(helm template cm consent-manager -f consent-manager/values-gcp.yaml | grep -c 'redis-ca')" -eq 0   # off unless asked for
      - name: The chart can run the logical backup on a schedule, for each database server (ADR-097)
        run: |
          # the script the Job runs is the one in deploy/backup
          diff deploy/backup/postgres-backup.sh deploy/helm/consent-manager/files/backup/postgres-backup.sh
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          test "$(helm template cm consent-manager -f consent-manager/values-aws.yaml | grep -c 'kind: CronJob')" -eq 0   # off by default
          helm template cm consent-manager -f consent-manager/values-aws.yaml --set logicalBackup.enabled=true --set logicalBackup.provider=aws             --set logicalBackup.destination=s3://bucket/dumps --set services.cm-aud-svc.database.host=aud.example.com             --set services.cm-aud-svc.database.name=cm_aud --set services.cm-aud-svc.database.passwordKey=AUD_DB_PASSWORD > /tmp/lb.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 < /tmp/lb.yaml
          test "$(grep -c 'kind: CronJob' /tmp/lb.yaml)" -eq 1
          grep -q 'name: dump-shared' /tmp/lb.yaml   # the platform's own server
          grep -q 'name: dump-cm-aud-svc' /tmp/lb.yaml   # and the service that has a server of its own
          grep -q 'aws s3 cp --sse aws:kms' /tmp/lb.yaml
          for cloud in azure gcp; do
            helm template cm consent-manager -f consent-manager/values-$cloud.yaml --set logicalBackup.enabled=true --set logicalBackup.provider=$cloud               --set logicalBackup.destination=dest://x | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0
          done
          # a destination and a provider are needed
          if helm template cm consent-manager -f consent-manager/values-aws.yaml --set logicalBackup.enabled=true > /dev/null 2>&1; then echo "rendered without a provider"; exit 1; fi
      - name: Each schema can have an owner of its own, made before the services migrate (ADR-110)
        run: |
          # the scripts the hooks run are the ones in deploy/database
          diff deploy/database/create-schema-owners.sh deploy/helm/consent-manager/files/database/create-schema-owners.sh
          diff deploy/database/create-runtime-roles.sh deploy/helm/consent-manager/files/database/create-runtime-roles.sh
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          helm template cm consent-manager -f consent-manager/values-aws.yaml --set config.database.leastPrivilege.enabled=true \
            --set config.database.leastPrivilege.perSchemaOwners=true > /tmp/po.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 < /tmp/po.yaml
          test "$(grep -c 'SPRING_FLYWAY_USER, value: "cm_[a-z_]*_owner"' /tmp/po.yaml)" -eq 7   # every service migrates as its own owner
          test "$(grep -c 'SPRING_R2DBC_USERNAME, value: "cm_[a-z_]*_app"' /tmp/po.yaml)" -eq 7   # and queries as its own login
          grep -q 'args: \["aud","bil","cns_cmd","cns_qry","df_reg","dsr","ntf"\]' /tmp/po.yaml
          grep -q 'name: PER_SCHEMA_OWNERS, value: "1"' /tmp/po.yaml   # the logins follow the owners
          test "$(grep -c 'name: cm-database-owners$' /tmp/po.yaml)" -eq 1
          # without the switch: no owners hook, the shared owner, and the logins as before
          helm template cm consent-manager -f consent-manager/values-aws.yaml --set config.database.leastPrivilege.enabled=true > /tmp/po0.yaml
          test "$(grep -c 'name: cm-database-owners$' /tmp/po0.yaml)" -eq 0
          test "$(grep -c 'SPRING_FLYWAY_USER, value: "cm"' /tmp/po0.yaml)" -eq 7
      - name: The chart can make the per-service logins and use them with one switch (ADR-090)
        run: |
          # the script the hook runs is the one in deploy/database
          diff deploy/database/create-runtime-roles.sh deploy/helm/consent-manager/files/database/create-runtime-roles.sh
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          helm template cm consent-manager -f consent-manager/values-aws.yaml --set config.database.leastPrivilege.enabled=true > /tmp/lp1.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 < /tmp/lp1.yaml
          test "$(grep -c 'SPRING_R2DBC_USERNAME, value: "cm_[a-z_]*_app"' /tmp/lp1.yaml)" -eq 7   # every service queries as its own login
          test "$(grep -c 'SPRING_FLYWAY_USER, value: "cm"' /tmp/lp1.yaml)" -eq 7   # and migrates as the owner
          grep -q 'args: \["aud","bil","cns_cmd","cns_qry","df_reg","dsr","ntf"\]' /tmp/lp1.yaml   # the hook makes a login for each schema
          # off, nothing changes: no hook, every service on the one login
          helm template cm consent-manager -f consent-manager/values-aws.yaml > /tmp/lp0.yaml
          test "$(grep -c 'name: cm-database-roles$' /tmp/lp0.yaml)" -eq 0
          test "$(grep -c 'name: cm-database-roles$' /tmp/lp1.yaml)" -eq 1   # the job
      - name: A service can query as a login of its own and migrate as the owner (ADR-082)
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          helm template cm consent-manager -f consent-manager/values-aws.yaml --set config.database.migrationUser=cm \
            --set config.database.migrationPasswordKey=DB_PASSWORD --set services.cm-aud-svc.database.user=cm_aud_app \
            --set services.cm-aud-svc.database.passwordKey=CM_AUD_RUNTIME_DB_PASSWORD > /tmp/lp.yaml
          test "$(grep -c 'SPRING_R2DBC_USERNAME, value: "cm_aud_app"' /tmp/lp.yaml)" -eq 1
          test "$(grep -c 'key: CM_AUD_RUNTIME_DB_PASSWORD' /tmp/lp.yaml)" -eq 1   # its queries only: the migration keeps the owner's password
          test "$(grep -c 'SPRING_FLYWAY_USER, value: "cm"' /tmp/lp.yaml)" -eq 7   # every service migrates as the owner
      - name: A service can be given a database of its own, and only that service (ADR-074)
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          helm template cm consent-manager -f consent-manager/values-aws.yaml \
            --set services.cm-aud-svc.database.host=aud-db.example.com --set services.cm-aud-svc.database.name=cm_aud \
            --set services.cm-aud-svc.database.passwordKey=AUD_DB_PASSWORD > /tmp/split.yaml
          grep -q 'postgresql://aud-db.example.com:5432/cm_aud?schema=aud' /tmp/split.yaml
          grep -q 'key: AUD_DB_PASSWORD' /tmp/split.yaml
          test "$(grep -c 'aud-db.example.com' /tmp/split.yaml)" -eq 2   # its R2DBC and Flyway URLs, no other service's
      - name: The chart passes traces on only when asked, and needs an endpoint for them (ADR-093)
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          test "$(helm template cm consent-manager -f consent-manager/values-aws.yaml | grep -c CM_TRACING)" -eq 0
          helm template cm consent-manager -f consent-manager/values-aws.yaml --set tracing.enabled=true --set tracing.endpoint=http://tempo:4318/v1/traces > /tmp/tr.yaml
          test "$(grep -c 'name: CM_TRACING_SAMPLING' /tmp/tr.yaml)" -eq 9
          if helm template cm consent-manager -f consent-manager/values-aws.yaml --set tracing.enabled=true > /dev/null 2>&1; then echo "rendered without an endpoint"; exit 1; fi
      - name: The chart renders with a mesh, metrics and a scraper allowed (ADR-070, ADR-073)
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          for mesh in istio linkerd; do
            helm template cm consent-manager -f consent-manager/values-aws.yaml --set mesh.provider=$mesh --set metrics.enabled=true \
              --set 'networkPolicy.metricsNamespaceLabels.kubernetes\.io/metadata\.name=monitoring' \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0
          done
      - name: The chart renders with the policy taken from a signed bundle (ADR-068), and refuses to without a key
        run: |
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts" -w /charts alpine/helm:3.16.4 "$@"; }
          printf 'opa:\n  bundle:\n    enabled: true\n    serviceUrl: https://policy.example.com/bundles\n    publicKey: |\n      -----BEGIN PUBLIC KEY-----\n      AAAA\n      -----END PUBLIC KEY-----\n' > deploy/helm/ci-bundle.yaml
          helm template cm consent-manager -f consent-manager/values-aws.yaml -f ci-bundle.yaml \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0
          # a bundle with no key to verify it against must never render: it would load anything
          printf 'opa:\n  bundle:\n    enabled: true\n    serviceUrl: https://policy.example.com/bundles\n' > deploy/helm/ci-bundle-nokey.yaml
          if helm template cm consent-manager -f consent-manager/values-aws.yaml -f ci-bundle-nokey.yaml > /dev/null 2>&1; then
            echo "::error::The chart rendered a policy bundle with no public key to verify it"
            exit 1
          fi
          rm -f deploy/helm/ci-bundle.yaml deploy/helm/ci-bundle-nokey.yaml
      - name: The chart's OPA policy is the one the services are tested with
        run: diff infra/opa/policies/cns_authz.rego deploy/helm/consent-manager/files/opa/cns_authz.rego
      - name: No deployment lifts the sign-in code limits
        # ADR-061: the local stack exempts a few fixed test accounts from the limit on codes sent to one address. It is a
        # Keycloak server setting for docker compose only, and must never reach a Helm chart, Terraform or a realm export.
        run: |
          if grep -rniE "EXEMPT_ADDRESSES|exempt-addresses" deploy infra/keycloak; then
            echo "::error::A deployment sets the local-only sign-in exemption (ADR-061). Remove it."
            exit 1
          fi

  opa-bundle:
    name: Authorisation policy bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Build a signed bundle, serve it, and start OPA against it with and without tampering (ADR-068)
        # real OPA servers: the right key loads it; an altered bundle and a different key are both refused
        run: node tests/security/e2e-opa-bundle.mjs
      - name: Build the bundle (signed on main, when the signing key is configured)
        env:
          OPA_SIGNING_KEY_PEM: ${{ secrets.OPA_BUNDLE_SIGNING_KEY }}
          OPA_SIGNING_KEY_ID: ${{ vars.OPA_BUNDLE_KEY_ID || 'cm-policy' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$OPA_SIGNING_KEY_PEM" ]; then
            umask 077
            printf '%s\n' "$OPA_SIGNING_KEY_PEM" > "$RUNNER_TEMP/opa-signing-key.pem"
            OPA_SIGNING_KEY="$RUNNER_TEMP/opa-signing-key.pem" bash scripts/opa-bundle.sh --out dist/opa
            rm -f "$RUNNER_TEMP/opa-signing-key.pem"
          else
            echo "::notice::Building an unsigned bundle: signing happens on main, with OPA_BUNDLE_SIGNING_KEY set"
            bash scripts/opa-bundle.sh --out dist/opa
          fi
      - name: Upload the bundle and its manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: opa-bundle
          path: |
            dist/opa/*.tar.gz
            dist/opa/manifest-*.json
            dist/opa/*.public.pem
            dist/opa/test-report.txt
          retention-days: 30
