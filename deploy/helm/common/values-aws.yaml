# The common namespace on AWS (ADR-054): PostgreSQL and Redis are the managed services Terraform builds, outside the
# cluster, so only Keycloak runs from this chart. Pulsar comes from the Apache Pulsar chart (release "pulsar" in this
# namespace, three bookies and brokers), aliased as "pulsar" so the services' settings are the same everywhere. Set
# mailpit.enabled for a sandbox release: its cm-ntf-svc never delivers, it sends to Mailpit (ADR-037).

postgres:
  enabled: false
redis:
  enabled: false
pulsar:
  enabled: false
mailpit:
  enabled: false

serviceAliases:
  pulsar: pulsar-broker

keycloak:
  hostname: https://id.example.com
  database:
    # RDS: the consent-manager chart's database-init job creates the keycloak database
    host: REPLACE_WITH_RDS_ENDPOINT
    # the role Keycloak signs in as, with KEYCLOAK_DB_PASSWORD; owner of the keycloak database
    user: keycloak
    params: sslmode=require
  ingress:
    enabled: true
    host: id.example.com

init:
  postgres:
    enabled: false
  pulsar:
    clusterName: pulsar

externalSecrets:
  enabled: true
  storeRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  data:
    KEYCLOAK_DB_PASSWORD: {key: cm-production/application, property: KEYCLOAK_DB_PASSWORD}
    KEYCLOAK_ADMIN_PASSWORD: {key: cm-production/application, property: KEYCLOAK_ADMIN_PASSWORD}
