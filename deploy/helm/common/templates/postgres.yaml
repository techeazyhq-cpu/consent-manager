{{- if .Values.postgres.enabled }}
{{- $ctx := dict "root" . "name" "postgres" }}
{{- $p := .Values.postgres }}
{{/* One PostgreSQL for both apps: each has its own database and roles (the init Job), none is superuser. */}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "common.labels" $ctx | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "common.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "common.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "common.podSecurityContext" (dict "uid" 70) | nindent 8 }}
      containers:
        - name: postgres
          image: {{ $p.image }}
          env:
            - {name: POSTGRES_USER, value: postgres}
            - name: POSTGRES_PASSWORD
              {{- include "common.secretRef" (dict "root" . "key" "POSTGRES_PASSWORD") | nindent 14 }}
            # below the mount point, which may hold lost+found
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          startupProbe:
            exec: {command: [pg_isready, -U, postgres, -h, 127.0.0.1]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres, -h, 127.0.0.1]}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres, -h, 127.0.0.1]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml $p.resources | nindent 12 }}
          securityContext: {{- include "common.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
  volumeClaimTemplates:
    {{- include "common.volumeClaim" $p | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "common.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "common.selectorLabels" $ctx | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
{{- end }}
