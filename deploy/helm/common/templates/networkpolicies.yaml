{{- if .Values.networkPolicy.enabled }}
{{- $ctx := dict "root" . "name" "network" }}
{{/* Default deny into every pod of the namespace, this chart's or another's (the Apache Pulsar chart, the Keycloak
     Operator); then the namespace itself, the apps' namespaces, and the ingress controller for Keycloak (ADR-054). */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: common-default-deny-ingress
  labels: {{- include "common.labels" $ctx | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The servers' own traffic (the init Job, Keycloak to PostgreSQL, a Pulsar chart's components), and the apps.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: common-from-apps
  labels: {{- include "common.labels" $ctx | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{- toYaml .Values.networkPolicy.clientNamespaces | nindent 18 }}
---
# Browsers sign in through the ingress controller: Keycloak's HTTP port only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: common-keycloak-from-ingress
  labels: {{- include "common.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- toYaml .Values.networkPolicy.keycloakPodLabels | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8080}
{{- end }}
