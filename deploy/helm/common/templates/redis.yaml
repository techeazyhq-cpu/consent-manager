{{- if .Values.redis.enabled }}
{{- $ctx := dict "root" . "name" "redis" }}
{{- $r := .Values.redis }}
{{/* One Redis, one database index per app: 0 consent-manager, 1 its sandbox, 2 notification-service. */}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels: {{- include "common.labels" $ctx | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {{- include "common.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "common.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "common.podSecurityContext" (dict "uid" 999) | nindent 8 }}
      containers:
        - name: redis
          image: {{ $r.image }}
          # the append-only file survives a restart: rate-limit and usage counters, sessions
          args: [redis-server, --appendonly, "yes", --dir, /data]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml $r.resources | nindent 12 }}
          securityContext: {{- include "common.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    {{- include "common.volumeClaim" $r | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "common.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "common.selectorLabels" $ctx | nindent 4 }}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
{{- end }}
