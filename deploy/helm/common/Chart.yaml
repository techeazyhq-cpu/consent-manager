apiVersion: v2
name: common
description: >-
  The servers consent-manager and notification-service share, in the "common" namespace (ADR-054): PostgreSQL, Redis,
  Pulsar, Keycloak and Mailpit, each one switchable, with the init Job that creates their databases, roles and Pulsar
  tenants. Single-replica: for development and test clusters (k3s, kind). On a cloud, PostgreSQL and Redis stay managed
  and only Keycloak (and Mailpit for a sandbox) run from here.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.30.0-0"
