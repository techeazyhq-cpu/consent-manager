# EKS (deploy/terraform/aws): ALB or NGINX ingress, RDS PostgreSQL, ElastiCache Redis, secrets from Secrets Manager.
ingress:
  className: nginx
config:
  database:
    # terraform output postgres_endpoint; the RDS CA bundle is mounted with extraEnv/volumes in a hardened setup
    host: REPLACE_WITH_RDS_ENDPOINT
    jdbcParams: "sslmode=require"
  redis:
    host: REPLACE_WITH_ELASTICACHE_ENDPOINT
    ssl: true
externalSecrets:
  enabled: true
  storeRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  data:
    DB_PASSWORD: {key: cm-production/application, property: DB_PASSWORD}
    DFREG_SECRETS_KEY: {key: cm-production/application, property: DFREG_SECRETS_KEY}
    CNS_TKN_JWKS: {key: cm-production/application, property: CNS_TKN_JWKS}
    KEYCLOAK_ADMIN_PASSWORD: {key: cm-production/application, property: KEYCLOAK_ADMIN_PASSWORD}
    NTF_SVC_API_KEY: {key: cm-production/application, property: NTF_SVC_API_KEY}
    NTF_SVC_SIGNING_SECRET: {key: cm-production/application, property: NTF_SVC_SIGNING_SECRET}
databaseInit:
  # RDS creates only consent_manager
  enabled: true
