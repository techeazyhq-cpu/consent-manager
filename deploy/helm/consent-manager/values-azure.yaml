# AKS (deploy/terraform/azure): Azure PostgreSQL Flexible Server, Azure Managed Redis, secrets from Key Vault.
ingress:
  className: nginx
config:
  database:
    host: REPLACE_WITH_FLEXIBLE_SERVER_FQDN
    jdbcParams: "sslmode=require"
  redis:
    host: REPLACE_WITH_MANAGED_REDIS_HOST
    port: 10000
    ssl: true
    passwordFromSecret: true
externalSecrets:
  enabled: true
  storeRef: {kind: ClusterSecretStore, name: azure-key-vault}
  data:
    DB_PASSWORD: {key: db-password}
    MIGRATION_DB_PASSWORD: {key: migration-db-password}
    DFREG_SECRETS_KEY: {key: dfreg-secrets-key}
    CNS_TKN_JWKS: {key: cns-tkn-jwks}
    CNS_RCPT_JWKS: {key: cns-rcpt-jwks}
    CNSCMD_SECRETS_KEY: {key: cnscmd-secrets-key}
    KEYCLOAK_ADMIN_PASSWORD: {key: keycloak-admin-password}
    REDIS_PASSWORD: {key: redis-password}
    NTF_SVC_API_KEY: {key: ntf-svc-api-key}
    NTF_SVC_SIGNING_SECRET: {key: ntf-svc-signing-secret}
databaseInit:
  # Terraform creates both consent_manager and keycloak
  enabled: false
