# GKE (deploy/terraform/gcp): Cloud SQL PostgreSQL (private IP), Memorystore Redis, secrets from Secret Manager.
ingress:
  className: nginx
config:
  database:
    host: REPLACE_WITH_CLOUD_SQL_PRIVATE_IP
    jdbcParams: "sslmode=require"
    r2dbcParams: "sslMode=require"
  redis:
    host: REPLACE_WITH_MEMORYSTORE_HOST
    ssl: true
    passwordFromSecret: true
externalSecrets:
  enabled: true
  storeRef: {kind: ClusterSecretStore, name: gcp-secret-manager}
  data:
    DB_PASSWORD: {key: cm-production-db-password}
    MIGRATION_DB_PASSWORD: {key: cm-production-migration-db-password}
    DFREG_SECRETS_KEY: {key: cm-production-dfreg-secrets-key}
    CNS_TKN_JWKS: {key: cm-production-cns-tkn-jwks}
    CNS_RCPT_JWKS: {key: cm-production-cns-rcpt-jwks}
    CNSCMD_SECRETS_KEY: {key: cm-production-cnscmd-secrets-key}
    KEYCLOAK_ADMIN_PASSWORD: {key: cm-production-keycloak-admin-password}
    REDIS_PASSWORD: {key: cm-production-redis-password}
    NTF_SVC_API_KEY: {key: cm-production-ntf-svc-api-key}
    NTF_SVC_SIGNING_SECRET: {key: cm-production-ntf-svc-signing-secret}
databaseInit:
  # Terraform creates both consent_manager and keycloak
  enabled: false
networkPolicy:
  # The managed PostgreSQL and Redis are private addresses in the network Terraform builds: merge Terraform's
  # helm_values output, whose networkPolicy.datastoreEgress opens exactly those (deploy/README.md). Pulsar and
  # Keycloak are in the common namespace (ADR-054).
  datastoreEgress: []
