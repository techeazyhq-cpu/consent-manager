{{/* The three web apps: static builds served by unprivileged nginx (infra/docker/Dockerfile.ui). */}}
{{- $root := . }}
{{- range $name, $w := .Values.webApps }}
{{- $ctx := dict "root" $root "name" $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "cm.labels" $ctx | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ $w.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "cm.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cm.selectorLabels" $ctx | nindent 8 }}
        app.kubernetes.io/part-of: consent-manager
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "cm.podSecurityContext" (dict "uid" 101) | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "cm.image" $ctx }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {memory: 64Mi}}
          securityContext: {{- include "cm.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "cm.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "cm.selectorLabels" $ctx | nindent 4 }}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- end }}
