{{- $lb := .Values.logicalBackup | default dict }}
{{- if $lb.enabled }}
{{- $ctx := dict "root" . "name" "logical-backup" }}
{{- $db := .Values.config.database }}
{{- $provider := required "logicalBackup.provider must be aws, azure, gcp or custom" $lb.provider }}
{{- $dest := required "logicalBackup.destination is required (s3://bucket/prefix, https://account.blob.core.windows.net/container or gs://bucket/prefix)" $lb.destination }}
{{- $owner := $db.migrationUser | default $db.user }}
{{- $ownerKey := $db.migrationPasswordKey | default $db.passwordKey | default "DB_PASSWORD" }}
{{/* The platform's own database server first, then each service that has a server of its own (ADR-074): one dump run each, in order, then
     one upload. A failed dump fails the Job and nothing is uploaded from that run (ADR-097). */}}
{{- $targets := list (dict "name" "shared" "host" $db.host "port" $db.port "user" $owner "key" $ownerKey "databases" ($lb.databases | default (list $db.name))) }}
{{- range $name, $s := .Values.services }}
{{- if and $s.database $s.database.host }}
{{- $targets = append $targets (dict "name" $name "host" $s.database.host "port" ($s.database.port | default $db.port) "user" ($s.database.user | default $owner) "key" ($s.database.passwordKey | default "DB_PASSWORD") "databases" (list ($s.database.name | default $db.name))) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $lb.serviceAccount.name | default "cm-logical-backup" }}
  labels: {{- include "cm.labels" $ctx | nindent 4 }}
  {{- with $lb.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-logical-backup-script
  labels: {{- include "cm.labels" $ctx | nindent 4 }}
data:
  postgres-backup.sh: |
{{ .Files.Get "files/backup/postgres-backup.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-logical-backup
  labels: {{- include "cm.labels" $ctx | nindent 4 }}
spec:
  schedule: {{ $lb.schedule | default "0 1 * * *" | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $lb.deadlineSeconds | default 7200 }}
      template:
        metadata:
          labels:
            {{- include "cm.selectorLabels" $ctx | nindent 12 }}
            app.kubernetes.io/part-of: consent-manager
            {{- with $lb.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ $lb.serviceAccount.name | default "cm-logical-backup" }}
          securityContext: {{- include "cm.podSecurityContext" (dict "uid" 999) | nindent 12 }}
          initContainers:
            {{- range $targets }}
            - name: dump-{{ .name }}
              image: {{ $lb.image | default "postgres:16" }}
              command: ["/bin/bash", "/scripts/postgres-backup.sh"]
              env:
                - {name: PGHOST, value: {{ .host | quote }}}
                - {name: PGPORT, value: {{ .port | quote }}}
                - {name: PGUSER, value: {{ .user | quote }}}
                - {name: PGSSLMODE, value: {{ ($db.tls | default dict).mode | default "require" | quote }}}
                {{- if ($db.tls | default dict).caConfigMap }}
                - {name: PGSSLROOTCERT, value: {{ include "cm.dbCaPath" $ | quote }}}
                {{- end }}
                - name: PGPASSWORD
                  {{- include "cm.secretRef" (dict "root" $ "key" .key) | nindent 18 }}
                - {name: BACKUP_DATABASES, value: {{ join " " .databases | quote }}}
                - {name: BACKUP_MANIFEST_PREFIX, value: {{ .name | quote }}}
                - {name: BACKUP_DIR, value: /backup}
                - {name: BACKUP_KEEP_LOCAL_DAYS, value: "0"}
              resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 512Mi}}
              securityContext: {{- include "cm.containerSecurityContext" $ | nindent 16 }}
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
                - {name: backup, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
                {{- if ($db.tls | default dict).caConfigMap }}
                - {name: db-ca, mountPath: /etc/db-ca, readOnly: true}
                {{- end }}
            {{- end }}
          containers:
            - name: upload
              {{- if eq $provider "aws" }}
              image: {{ ($lb.upload | default dict).image | default "amazon/aws-cli:2.27.50" }}
              {{- else if eq $provider "azure" }}
              image: {{ ($lb.upload | default dict).image | default "mcr.microsoft.com/azure-cli:2.75.0" }}
              {{- else if eq $provider "gcp" }}
              image: {{ ($lb.upload | default dict).image | default "google/cloud-sdk:529.0.0-alpine" }}
              {{- else }}
              image: {{ required "logicalBackup.upload.image is required with provider custom" ($lb.upload | default dict).image }}
              {{- end }}
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  for f in /backup/*; do
                    n="$(basename "$f")"
                    {{- if eq $provider "aws" }}
                    aws s3 cp --sse aws:kms --no-progress "$f" "$DEST/$n"
                    {{- else if eq $provider "azure" }}
                    az login --service-principal -u "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" --output none
                    az storage blob upload --blob-url "$DEST/$n" --file "$f" --auth-mode login --no-progress --output none
                    {{- else if eq $provider "gcp" }}
                    gcloud storage cp "$f" "$DEST/$n"
                    {{- else }}
                    {{ required "logicalBackup.upload.script is required with provider custom (a shell snippet that uses $f, $n and $DEST)" ($lb.upload | default dict).script | nindent 20 }}
                    {{- end }}
                    echo "uploaded $n"
                  done
              env:
                - {name: DEST, value: {{ $dest | quote }}}
                - {name: HOME, value: /tmp}
                - {name: AZURE_CONFIG_DIR, value: /tmp/az}
                - {name: CLOUDSDK_CONFIG, value: /tmp/gcloud}
              resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
              securityContext: {{- include "cm.containerSecurityContext" . | nindent 16 }}
              volumeMounts:
                - {name: backup, mountPath: /backup, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap: {name: {{ .Release.Name }}-logical-backup-script, defaultMode: 0555}
            - name: backup
              emptyDir: {sizeLimit: {{ $lb.scratchSize | default "20Gi" }}}
            - name: tmp
              emptyDir: {sizeLimit: 64Mi}
            {{- if ($db.tls | default dict).caConfigMap }}
            - name: db-ca
              configMap:
                name: {{ $db.tls.caConfigMap }}
                items:
                  - {key: {{ $db.tls.caKey | default "ca-bundle.pem" }}, path: ca-bundle.pem}
            {{- end }}
{{- end }}
