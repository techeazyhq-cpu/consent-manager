{{- if .Values.externalSecrets.enabled }}
{{- $ctx := dict "root" . "name" "secrets" }}
{{/* The chart's Secret, synced from the cloud's secret store (Terraform creates the entries; ADR-042). */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels: {{- include "cm.labels" $ctx | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: {{- toYaml .Values.externalSecrets.storeRef | nindent 4 }}
  target:
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
  data:
    {{- range $key, $remote := .Values.externalSecrets.data }}
    - secretKey: {{ $key }}
      remoteRef: {{- toYaml $remote | nindent 8 }}
    {{- end }}
{{- end }}
