global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: cm-services
    metrics_path: /actuator/prometheus
    static_configs:
      - {targets: ["cm-df-reg-svc:8081"], labels: {service: cm-df-reg-svc}}
      - {targets: ["cm-cns-cmd-svc:8082"], labels: {service: cm-cns-cmd-svc}}
      - {targets: ["cm-cns-qry-svc:8083"], labels: {service: cm-cns-qry-svc}}
      - {targets: ["cm-ntf-svc:8084"], labels: {service: cm-ntf-svc}}
      - {targets: ["cm-bil-svc:8085"], labels: {service: cm-bil-svc}}
      - {targets: ["cm-aud-svc:8086"], labels: {service: cm-aud-svc}}
      - {targets: ["cm-stf-svc:8087"], labels: {service: cm-stf-svc}}
      - {targets: ["cm-dsr-svc:8088"], labels: {service: cm-dsr-svc}}
      # the gateway serves its actuator on a separate internal port (CM_GW_MANAGEMENT_PORT)
      - {targets: ["cm-gw:9091"], labels: {service: cm-gw}}
  - job_name: opa
    metrics_path: /metrics
    static_configs:
      - {targets: ["opa:8181"], labels: {service: opa}}
