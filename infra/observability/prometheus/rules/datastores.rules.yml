# What the services depend on (ADR-087). The metric names are those of postgres_exporter, redis_exporter and Pulsar's own /metrics.
groups:
  - name: datastores
    rules:
      - alert: DatabaseDown
        expr: pg_up == 0
        for: 2m
        labels: {severity: page}
        annotations: {summary: "PostgreSQL cannot be reached by its exporter for 2 minutes"}
      - alert: DatabaseConnectionsNearlyAll
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels: {severity: ticket}
        annotations: {summary: "PostgreSQL has more than 80% of its connections open: the pools of the services add up (ADR-052)"}
      - alert: RedisDown
        expr: redis_up == 0
        for: 2m
        labels: {severity: page}
        annotations: {summary: "Redis cannot be reached by its exporter for 2 minutes: rate limits and the status page are affected"}
      - alert: RedisMemoryNearlyFull
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9 and redis_memory_max_bytes > 0
        for: 10m
        labels: {severity: ticket}
        annotations: {summary: "Redis has used more than 90% of the memory it is allowed"}
      - alert: PulsarDown
        expr: up{job="pulsar"} == 0
        for: 2m
        labels: {severity: page}
        annotations: {summary: "Pulsar cannot be scraped for 2 minutes: events are not being delivered between services"}
