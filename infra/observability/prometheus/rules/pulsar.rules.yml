# A consumer that is not keeping up or is stuck (ADR-107). The metrics are Pulsar's own, scraped from the broker (the `pulsar` job); the
# subscriptions that start with two underscores are the broker's own (compaction, system readers), not the platform's consumers.
groups:
  - name: pulsar-backlog
    rules:
      - alert: PulsarSubscriptionBacklogLarge
        expr: max by (namespace, topic, subscription) (pulsar_subscription_back_log_no_delayed{subscription!~"__.*"}) > 1000
        for: 10m
        labels: {severity: ticket}
        annotations: {summary: "A consumer is more than 1000 messages behind for 10 minutes: events are arriving faster than it handles them, or it is slow (the threshold is a guess, ADR-107)"}
      - alert: PulsarSubscriptionNeverCaughtUp
        expr: min_over_time(pulsar_subscription_back_log_no_delayed{subscription!~"__.*"}[15m]) > 0
        for: 5m
        labels: {severity: page}
        annotations: {summary: "A consumer has not reached an empty backlog in 15 minutes: it is stopped, stuck on a message it keeps refusing, or far behind"}
