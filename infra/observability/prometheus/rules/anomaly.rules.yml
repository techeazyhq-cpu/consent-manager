# A fiduciary whose activity in an hour was far above its own usual, found by the audit service from the ledger's counts (ADR-112). The
# finding itself, with the fiduciary and the numbers, is on the Anomalies page of CM Admin.
groups:
  - name: anomaly
    rules:
      - alert: UnusualFiduciaryActivity
        expr: increase(cm_aud_anomaly_found_total[15m]) > 0
        labels: {severity: ticket}
        annotations: {summary: "A fiduciary's {{ $labels.signal }} in the last hour was far above its own usual: open the Anomalies page in CM Admin to see which and by how much"}
