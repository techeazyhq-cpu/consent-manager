# Unit tests for cronjobs.rules.yml (ADR-097): `promtool test rules` with these series.
rule_files:
  - ../cronjobs.rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      # last success 2 hours ago and a Job that never failed: quiet
      - series: 'kube_cronjob_status_last_successful_time{cronjob="cm-logical-backup"}'
        values: '0x20'
      - series: 'kube_job_status_failed{job_name="cm-logical-backup-29000000"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: LogicalBackupJobFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: LogicalBackupCronJobNotSucceeding
        exp_alerts: []
  - interval: 1m
    input_series:
      # a Job that failed from the third minute on
      - series: 'kube_job_status_failed{job_name="cm-logical-backup-29000001",namespace="cm"}'
        values: '0 0 1x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: LogicalBackupJobFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: LogicalBackupJobFailed
        exp_alerts:
          - exp_labels: {severity: page, job_name: cm-logical-backup-29000001, namespace: cm}
            exp_annotations:
              summary: "A logical backup Job failed: read its pod's logs (dump-* init containers, then upload); nothing was uploaded from that run"
      # another CronJob's Job is not this alert's business
  - interval: 1m
    input_series:
      - series: 'kube_job_status_failed{job_name="cm-database-roles-1",namespace="cm"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: LogicalBackupJobFailed
        exp_alerts: []
  - interval: 1m
    input_series:
      # the CronJob's last success was at time 0 and now is more than 36 hours later (129600 s = 2160 min)
      - series: 'kube_cronjob_status_last_successful_time{cronjob="cm-logical-backup",namespace="cm"}'
        values: '0x2200'
    alert_rule_test:
      - eval_time: 2000m
        alertname: LogicalBackupCronJobNotSucceeding
        exp_alerts: []
      - eval_time: 2200m
        alertname: LogicalBackupCronJobNotSucceeding
        exp_alerts:
          - exp_labels: {severity: page, cronjob: cm-logical-backup, namespace: cm}
            exp_annotations:
              summary: "No logical backup Job has succeeded for 36 hours (it is meant to run daily)"
