# Unit tests for anomaly.rules.yml (ADR-112).
rule_files:
  - ../anomaly.rules.yml
evaluation_interval: 1m
tests:
  - interval: 5m
    input_series:
      - series: 'cm_aud_anomaly_found_total{signal="consent-requests"}'
        values: '0 0 0 1 1 1 1 1'
    alert_rule_test:
      # a finding was just counted
      - eval_time: 15m
        alertname: UnusualFiduciaryActivity
        exp_alerts:
          - exp_labels: {severity: ticket, signal: consent-requests}
            exp_annotations:
              summary: "A fiduciary's consent-requests in the last hour was far above its own usual: open the Anomalies page in CM Admin to see which and by how much"
      # and a quarter of an hour later it is not counted again
      - eval_time: 35m
        alertname: UnusualFiduciaryActivity
        exp_alerts: []
