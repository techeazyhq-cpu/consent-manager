# Unit tests for the sign-in surge rule (ADR-112).
rule_files:
  - ../sign-in.rules.yml
evaluation_interval: 1m
tests:
  # steady traffic, twelve codes an hour: nothing fires
  - interval: 10m
    input_series:
      - series: 'cm_ntf_otp_send_accepted_total'
        values: '0+2x160'
    alert_rule_test:
      - eval_time: 26h
        alertname: SignInCodeSurge
        exp_alerts: []
  # a day of twelve an hour, then 240 in an hour
  - interval: 10m
    input_series:
      - series: 'cm_ntf_otp_send_accepted_total'
        values: '0+2x150 300+40x10'
    alert_rule_test:
      - eval_time: 26h
        alertname: SignInCodeSurge
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "Sign-in codes sent in the last hour are more than six times the hourly average of the day before: a campaign to sign in in bulk, a bot, or a real event such as a launch; see docs/runbooks/anomaly-detection.md"
  # a rise under the floor of 50 an hour is not a surge, however large the ratio to a quiet day
  - interval: 10m
    input_series:
      - series: 'cm_ntf_otp_send_accepted_total'
        values: '0+0x150 0+4x10'
    alert_rule_test:
      - eval_time: 26h
        alertname: SignInCodeSurge
        exp_alerts: []
