# Unit tests for datastores.rules.yml (ADR-092): `promtool test rules` with these series.
rule_files:
  - ../datastores.rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      # a session idle in a transaction for 3 minutes and growing: fires after 5 minutes of that
      - series: 'pg_stat_activity_max_tx_duration{state="idle in transaction",datname="consent_manager"}'
        values: '0 0 180+60x14'
      # a short statement never fires
      - series: 'pg_stat_activity_max_tx_duration{state="active",datname="consent_manager"}'
        values: '5+0x16'
    alert_rule_test:
      - eval_time: 4m
        alertname: DatabaseTransactionIdleOpen
        exp_alerts: []
      - eval_time: 12m
        alertname: DatabaseTransactionIdleOpen
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "A database session has sat in a transaction doing nothing for more than 2 minutes: it holds its locks and a pool connection (ADR-092)"
      - eval_time: 12m
        alertname: DatabaseTransactionRunningLong
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'pg_stat_activity_max_tx_duration{state="active",datname="consent_manager"}'
        values: '0 0 700+60x14'
    alert_rule_test:
      - eval_time: 3m
        alertname: DatabaseTransactionRunningLong
        exp_alerts: []
      - eval_time: 10m
        alertname: DatabaseTransactionRunningLong
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "A database statement has been running for more than 10 minutes: a slow query, a lock wait, or a migration (ADR-092)"
