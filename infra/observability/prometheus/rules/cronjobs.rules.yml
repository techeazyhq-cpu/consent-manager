# The logical backup CronJob of the Helm chart (ADR-097), seen through kube-state-metrics: it runs in a cluster, so there is no
# node_exporter textfile to read (postgres-recovery.rules.yml is for a backup run from a host).
groups:
  - name: logical-backup-cronjob
    rules:
      - alert: LogicalBackupJobFailed
        expr: kube_job_status_failed{job_name=~".*-logical-backup-.*"} > 0
        for: 5m
        labels: {severity: page}
        annotations: {summary: "A logical backup Job failed: read its pod's logs (dump-* init containers, then upload); nothing was uploaded from that run"}
      - alert: LogicalBackupCronJobNotSucceeding
        expr: time() - kube_cronjob_status_last_successful_time{cronjob=~".*-logical-backup"} > 129600
        for: 15m
        labels: {severity: page}
        annotations: {summary: "No logical backup Job has succeeded for 36 hours (it is meant to run daily)"}
