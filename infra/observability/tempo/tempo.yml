# Traces (ADR-093): one Tempo, local files, kept 3 days. Takes OTLP over HTTP (4318) from the services.
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
compactor:
  compaction:
    block_retention: 72h
usage_report:
  reporting_enabled: false
