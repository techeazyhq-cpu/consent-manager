# Backend services build via infra/docker/Dockerfile.service, which wraps an already-built
# JAR (`./gradlew build` on the host first). This is a pragmatic testing workaround, not
# Phase 1's intended approach — plan §6 calls for Spring Boot Buildpacks, no hand-written
# Dockerfile, but this environment's Docker Desktop rejects bootBuildImage's pinned old
# Docker API version (v1.24) with a 400; see the Dockerfile's own header comment.
#
# Each backend service activates its "docker" Spring profile (application-docker.yml,
# sitting next to each service's default application.yml) for container-network hostnames —
# not per-field environment variable overrides. Spring's relaxed env-var binding does not
# merge indexed list properties (e.g. cm-gw's spring.cloud.gateway.routes[]) across sources,
# so overriding even one field of one route via an env var silently drops the rest of that
# route list; discovered and fixed during Phase 1 verification.

x-sbx-env: &sbx-env
  SPRING_PROFILES_ACTIVE: docker,sandbox
  CM_PULSAR_TENANT: cm-sbx
  # small heaps: the sandbox carries test traffic only
  JAVA_TOOL_OPTIONS: -Xmx256m -XX:+UseSerialGC

x-sbx-service: &sbx-service
  profiles: [sandbox]
  environment: *sbx-env
  depends_on:
    sbx-pg-init:
      condition: service_completed_successfully
    sbx-pulsar-init:
      condition: service_completed_successfully
    keycloak:
      condition: service_started
    redis:
      condition: service_healthy
    sbx-mailpit:
      condition: service_started
    sbx-opa:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cm
      POSTGRES_PASSWORD: cm
      POSTGRES_DB: consent_manager
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cm -d consent_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  pulsar:
    image: apachepulsar/pulsar:3.3.1
    command: bin/pulsar standalone
    environment:
      # Standalone runs ZooKeeper, a bookie and a broker in one JVM; its defaults take ~1.7 GB. Capped for laptops,
      # which also run the sandbox (ADR-037): plenty for development traffic.
      PULSAR_MEM: -Xms256m -Xmx512m -XX:MaxDirectMemorySize=256m
    ports:
      - "6650:6650"
      - "8181:8080" # Pulsar's own admin/web port, remapped so it doesn't clash with Keycloak's 8080
    volumes:
      - pulsar-data:/pulsar/data
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 10

  # The cm tenant and its namespaces, created on every start if missing (ADR-004), so a fresh or reset broker needs
  # nothing by hand. Services that use Pulsar wait for it.
  pulsar-init:
    image: apachepulsar/pulsar:3.3.1
    entrypoint: ["/bin/bash", "/pulsar-init/init-tenant.sh"]
    environment:
      TENANT: cm
    volumes:
      - ./pulsar:/pulsar-init:ro
    depends_on:
      pulsar:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export:/opt/keycloak/data/import
      # Provider JARs built by ./gradlew build before `docker compose up`; start-dev picks them up on every start.
      # cm-idn-otp-spi (plan §9a): every realm's browser flow (cm-dp, cm-df, cm-staff; ADR-035), sending codes through cm-ntf-svc
      # (http://cm-ntf-svc:8084, authenticator config "cm-otp"). cm-idn-theme: the login themes, one per audience.
      - ../backend/keycloak-ext/build/providers:/opt/keycloak/providers

  opa:
    image: openpolicyagent/opa:1.20.1
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports:
      - "8282:8181" # cm-pdp's real port is 8181 inside the network; host-mapped to 8282 to avoid clashing with Pulsar's 8181 mapping above
    volumes:
      - ./opa/policies:/policies

  cm-df-reg-svc:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-df-reg-svc/cm-df-reg-boot/build/libs/cm-df-reg-boot-0.1.0-SNAPSHOT.jar
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CM_KEYCLOAK_ADMIN-USERNAME: admin
      CM_KEYCLOAK_ADMIN-PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  cm-cns-cmd-svc:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-cns-cmd-svc/cm-cns-cmd-boot/build/libs/cm-cns-cmd-boot-0.1.0-SNAPSHOT.jar
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - cns-tkn-keys:/var/lib/cm/keys # consent token signing keys, kept across restarts (ADR-006)
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
      cm-df-reg-svc:
        condition: service_started
      cm-bil-svc:
        condition: service_started

  cm-cns-qry-svc:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-cns-qry-svc/cm-cns-qry-boot/build/libs/cm-cns-qry-boot-0.1.0-SNAPSHOT.jar
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully

  cm-ntf-svc:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-ntf-svc/cm-ntf-boot/build/libs/cm-ntf-boot-0.1.0-SNAPSHOT.jar
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    # Written by notification-service/register-cm-client.mjs: switches delivery to notification-service
    # (cm.ntf.provider). Without it, cm-ntf-svc keeps using Mailpit and its in-memory catchers.
    env_file:
      - path: notification-service/cm-client.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway" # notification-service runs as its own compose project
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      mailpit:
        condition: service_started

  cm-bil-svc:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-bil-svc/cm-bil-boot/build/libs/cm-bil-boot-0.1.0-SNAPSHOT.jar
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  cm-aud-svc:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-aud-svc/cm-aud-boot/build/libs/cm-aud-boot-0.1.0-SNAPSHOT.jar
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  cm-stf-svc:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-stf-svc/cm-stf-boot/build/libs/cm-stf-boot-0.1.0-SNAPSHOT.jar
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CM_KEYCLOAK_ADMIN-USERNAME: admin
      CM_KEYCLOAK_ADMIN-PASSWORD: admin
    depends_on:
      keycloak:
        condition: service_started

  cm-gw:
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-gw/build/libs/cm-gw-0.1.0-SNAPSHOT.jar
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - keycloak
      - opa
      - redis
      - cm-df-reg-svc
      - cm-cns-cmd-svc
      - cm-cns-qry-svc
      - cm-ntf-svc
      - cm-bil-svc
      - cm-stf-svc

  # ---- The sandbox (ADR-034, ADR-037): `docker compose --profile sandbox up -d` ----
  # The same images as production with SPRING_PROFILES_ACTIVE=docker,sandbox: their own database (cm_sandbox), Keycloak
  # realms (sbx-cm-*), Pulsar tenant (cm-sbx), Redis database (1), consent token keys, PDP and inbox. Only the servers
  # (Postgres, Pulsar, Keycloak, Redis) are shared, to keep a laptop's footprint small; production runs it as its own
  # deployment with the same settings. Its gateway is http://localhost:9100, its inbox http://localhost:8125.

  sbx-pg-init:
    profiles: [sandbox]
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/sandbox/pg-init.sh"]
    volumes:
      - ./sandbox:/sandbox:ro
    depends_on:
      postgres:
        condition: service_healthy

  sbx-pulsar-init:
    profiles: [sandbox]
    image: apachepulsar/pulsar:3.3.1
    entrypoint: ["/bin/bash", "/pulsar-init/init-tenant.sh"]
    environment:
      TENANT: cm-sbx
    volumes:
      - ./pulsar:/pulsar-init:ro
    depends_on:
      pulsar:
        condition: service_started

  sbx-mailpit:
    profiles: [sandbox]
    image: axllent/mailpit:latest
    ports:
      - "8125:8025" # the sandbox's inbox: everything it "sends" lands here and nowhere else

  sbx-opa:
    profiles: [sandbox]
    image: openpolicyagent/opa:1.20.1
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies", "/sandbox-data"]
    volumes:
      - ./opa/policies:/policies:ro
      - ./sandbox/opa:/sandbox-data:ro # checks consent tokens against the sandbox's cm-cns-cmd-svc

  cm-sbx-df-reg-svc:
    <<: *sbx-service
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-df-reg-svc/cm-df-reg-boot/build/libs/cm-df-reg-boot-0.1.0-SNAPSHOT.jar
    environment:
      <<: *sbx-env
      CM_KEYCLOAK_ADMIN-USERNAME: admin
      CM_KEYCLOAK_ADMIN-PASSWORD: admin

  cm-sbx-cns-cmd-svc:
    <<: *sbx-service
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-cns-cmd-svc/cm-cns-cmd-boot/build/libs/cm-cns-cmd-boot-0.1.0-SNAPSHOT.jar
    volumes:
      - sbx-cns-tkn-keys:/var/lib/cm/keys # the sandbox's own consent token keys

  cm-sbx-cns-qry-svc:
    <<: *sbx-service
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-cns-qry-svc/cm-cns-qry-boot/build/libs/cm-cns-qry-boot-0.1.0-SNAPSHOT.jar

  cm-sbx-ntf-svc:
    <<: *sbx-service
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-ntf-svc/cm-ntf-boot/build/libs/cm-ntf-boot-0.1.0-SNAPSHOT.jar

  cm-sbx-bil-svc:
    <<: *sbx-service
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-bil-svc/cm-bil-boot/build/libs/cm-bil-boot-0.1.0-SNAPSHOT.jar

  cm-sbx-gw:
    <<: *sbx-service
    build:
      context: ../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: backend/services/cm-gw/build/libs/cm-gw-0.1.0-SNAPSHOT.jar
    ports:
      - "9100:9000"

volumes:
  cns-tkn-keys:
  sbx-cns-tkn-keys:
  pg-data:
  pulsar-data:
