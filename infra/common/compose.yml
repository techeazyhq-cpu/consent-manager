# The servers consent-manager and notification-service share on a laptop (ADR-053): one Postgres (a database each),
# one Redis (an index each), one Pulsar (a tenant or namespace each), Keycloak and Mailpit. Each app runs as its own
# compose project on the `common` network and finds them by these names. Start this first and wait for it:
#
#   docker compose -f infra/common/compose.yml up -d --wait
#
# Limits as ADR-052: no container can take more than its share of the laptop.

name: common

networks:
  default:
    name: common

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # consent-manager's user and database, as before; init/ adds notification-service's
      POSTGRES_USER: cm
      POSTGRES_PASSWORD: cm
      POSTGRES_DB: consent_manager
      NOTIFICATION_DB_OWNER_PASSWORD: notification
      NOTIFICATION_DB_APP_PASSWORD: notification_app
      KEYCLOAK_DB_PASSWORD: keycloak
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cm -d consent_manager"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pulsar:
    image: apachepulsar/pulsar:3.3.3
    # no functions worker or stream storage: neither app uses them, and they cost memory
    command: sh -c "bin/apply-config-from-env.py conf/standalone.conf && exec bin/pulsar standalone -nfw -nss"
    environment:
      PULSAR_MEM: -Xms256m -Xmx768m -XX:MaxDirectMemorySize=384m
      # notification-service's retention for public/default; consent-manager's tenants set nothing of their own
      defaultRetentionTimeInMinutes: "60"
      defaultRetentionSizeInMB: "1024"
    ports:
      - "6650:6650"
      - "8181:8080" # the admin API, remapped clear of Keycloak's 8080
    volumes:
      - pulsar-data:/pulsar/data
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 1536m}
    healthcheck:
      # the broker's own check over HTTP; pulsar-admin would start a JVM every 10 s (ADR-052)
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/admin/v2/brokers/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # consent-manager's tenants and namespaces (ADR-004), the sandbox's too (ADR-037), created on every start if missing
  pulsar-init:
    image: apachepulsar/pulsar:3.3.3
    entrypoint: ["/bin/bash", "-c", "TENANT=cm /pulsar-init/init-tenant.sh && TENANT=cm-sbx /pulsar-init/init-tenant.sh"]
    volumes:
      - ../pulsar:/pulsar-init:ro
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256m}
    depends_on:
      pulsar:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # its own database on the shared Postgres, so users and their ids survive a restart and realms import only once
      # (start-dev's default is an in-container H2, lost with the container)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      - "8080:8080"
    volumes:
      - ../keycloak/realm-export:/opt/keycloak/data/import
      # cm-idn-otp-spi and cm-idn-theme, built by ./gradlew build: every realm's passwordless sign-in and login themes
      - ../../backend/keycloak-ext/build/providers:/opt/keycloak/providers
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 1g}

  # one inbox for everything either app sends while developing
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128m}

volumes:
  pg-data:
  pulsar-data:
