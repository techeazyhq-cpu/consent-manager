server:
  port: 8087
  http2:
    enabled: true

spring:
  application:
    name: cm-stf-svc

cm:
  pulsar:
    service-url: pulsar://localhost:6650
  keycloak:
    base-url: http://localhost:8080
    realm: cm-staff
    admin-username: admin
    admin-password: admin

# Circuit breakers on calls to other services (ADR-016). One breaker per dependency: it opens when at least half of
# the last 20 calls failed because the dependency is unhealthy (cm-res-kit's RemoteFailures: unreachable, timed out,
# 5xx or 429; any other 4xx is the dependency working), refuses calls for 30s, then lets 3 trial calls through.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.techeazyhq.cm.reskit.RemoteFailures
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
    instances:
      # Creating an operator makes several calls: an admin token, the role, the user, its role mapping.
      keycloak-admin:
        timeout-duration: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
