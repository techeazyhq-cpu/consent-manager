server:
  port: 8086
  http2:
    enabled: true

spring:
  cloud:
    circuitbreaker:
      resilience4j:
        # The timestamp request has its own timeout (cm.aud.anchoring.timeout), longer than the default limit.
        disable-time-limiter-map:
          timestamp-authority: true
  application:
    name: cm-aud-svc
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/consent_manager?schema=aud
    username: cm
    password: cm
  flyway:
    url: jdbc:postgresql://localhost:5432/consent_manager
    user: cm
    password: cm
    schemas: aud
    default-schema: aud
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/cm-realm

cm:
  pulsar:
    service-url: pulsar://localhost:6650
  aud:
    # Checkpoints of the ledger, timestamped by an external RFC 3161 authority (ADR-015).
    anchoring:
      enabled: ${CM_AUD_ANCHORING_ENABLED:true}
      interval-ms: ${CM_AUD_ANCHORING_INTERVAL_MS:3600000}
      tsa-url: ${CM_AUD_TSA_URL:http://timestamp.digicert.com}
      timeout: 10s

# Circuit breakers on calls to other services (ADR-016). One breaker per dependency: it opens when at least half of
# the last 20 calls failed because the dependency is unhealthy (cm-res-kit's RemoteFailures: unreachable, timed out,
# 5xx or 429; any other 4xx is the dependency working), refuses calls for 30s, then lets 3 trial calls through.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.techeazyhq.cm.reskit.RemoteFailures
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info
