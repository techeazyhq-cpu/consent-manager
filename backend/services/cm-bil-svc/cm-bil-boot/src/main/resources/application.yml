server:
  port: 8085
  http2:
    enabled: true

spring:
  http:
    codecs:
      # Jackson 2, as the services' own code, until the move to Jackson 3 (#216)
      preferred-json-mapper: jackson2
  application:
    name: cm-bil-svc
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/consent_manager?schema=bil
    pool:
      # Wait at most 3 s for a connection, then fail, rather than queue until the gateway gives up at 10 s: under
      # overload a saturated pool held requests that long (docs/security/vapt-and-performance.md).
      max-acquire-time: 3s
      # 5, not r2dbc-pool's 10: past the knee of the ramp this service never had more than 2 connections in use, and
      # its background work takes one at a time (one outbox relay pass at a time). Postgres allows 100 for every service, notification-service
      # and Keycloak together, and they held 91 at once (vapt-and-performance.md, "Connection pools").
      initial-size: 1
      max-size: 5
    username: cm
    password: cm
  flyway:
    url: jdbc:postgresql://localhost:5432/consent_manager
    user: cm
    password: cm
    schemas: bil
    default-schema: bil
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

cm:
  pulsar:
    service-url: pulsar://localhost:6650

management:
  observations:
    enable:
      # Spring Security observes every filter, authentication and authorization of every request, and nothing reads
      # them: no service exports metrics or traces. They were part of the 8% of df-reg's CPU spent on observations
      # (docs/security/vapt-and-performance.md). HTTP request metrics are kept.
      spring:
        security: false
  endpoints:
    web:
      exposure:
        include: health,info
