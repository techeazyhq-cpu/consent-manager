server:
  port: 8085
  http2:
    enabled: true

spring:
  application:
    name: cm-bil-svc
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/consent_manager?schema=bil
    username: cm
    password: cm
  flyway:
    url: jdbc:postgresql://localhost:5432/consent_manager
    user: cm
    password: cm
    schemas: bil
    default-schema: bil
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

cm:
  pulsar:
    service-url: pulsar://localhost:6650

management:
  endpoints:
    web:
      exposure:
        include: health,info
