server:
  port: 8081
  http2:
    enabled: true

spring:
  application:
    name: cm-df-reg-svc
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/consent_manager?schema=df_reg
    pool:
      # Wait at most 3 s for a connection, then fail, rather than queue until the gateway gives up at 10 s: under
      # overload a saturated pool held requests that long (docs/security/vapt-and-performance.md).
      max-acquire-time: 3s
    username: cm
    password: cm
  flyway:
    url: jdbc:postgresql://localhost:5432/consent_manager
    user: cm
    password: cm
    schemas: df_reg
    default-schema: df_reg
    locations: classpath:db/migration

cm:
  pulsar:
    service-url: pulsar://localhost:6650
  service-urls:
    bil: http://localhost:8085
  keycloak:
    base-url: http://localhost:8080
    realm: cm-df
    admin-username: admin
    admin-password: admin
  dfreg:
    obx-relay:
      fixed-delay-ms: 1000
    # Seals API key signing secrets (ADR-041): base64 of 32 bytes. This value is for local development only;
    # production sets CM_DFREG_SECRETS_KEY from AWS KMS / Azure Key Vault / GCP Secret Manager.
    secrets-key: ${CM_DFREG_SECRETS_KEY:bG9jYWwtZGV2LW9ubHktc2VjcmV0cy1rZXktMzJieXQ=}

# Circuit breakers on calls to other services (ADR-016). One breaker per dependency: it opens when at least half of
# the last 20 calls failed because the dependency is unhealthy (cm-res-kit's RemoteFailures: unreachable, timed out,
# 5xx or 429; any other 4xx is the dependency working), refuses calls for 30s, then lets 3 trial calls through.
resilience4j:
  # Spring Cloud CircuitBreaker also puts each call in a semaphore bulkhead, by default 25 calls at once with no wait;
  # past that a call fails as if the dependency were down (the VAPT found API-key requests refused with 503 from 30 at
  # once). The time limiter and the breaker already guard against a slow dependency; this only bounds a runaway.
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 1000
        max-wait-duration: 0
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.techeazyhq.cm.reskit.RemoteFailures
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
    instances:
      # Activation makes three calls: an admin token, the client, its secret; inviting a member up to six.
      keycloak-admin:
        timeout-duration: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
