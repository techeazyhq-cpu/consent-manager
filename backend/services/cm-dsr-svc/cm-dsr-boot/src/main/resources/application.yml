server:
  port: 8088
  http2:
    enabled: true

spring:
  http:
    codecs:
      # Jackson 2, as the services' own code, until the move to Jackson 3 (#216)
      preferred-json-mapper: jackson2
  application:
    name: cm-dsr-svc
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/consent_manager?schema=dsr
    pool:
      # Wait at most 3 s for a connection, then fail, rather than queue until the gateway gives up at 10 s: under
      # overload a saturated pool held requests that long (docs/security/vapt-and-performance.md).
      max-acquire-time: 3s
      # Small, as billing's: requests are few and the outbox relay takes one connection at a time. Postgres allows 100
      # for every service, notification-service and Keycloak together (vapt-and-performance.md, "Connection pools").
      initial-size: 1
      max-size: 3
    username: cm
    password: cm
  flyway:
    url: jdbc:postgresql://localhost:5432/consent_manager
    user: cm
    password: cm
    schemas: dsr
    default-schema: dsr
    locations: classpath:db/migration

cm:
  pulsar:
    service-url: pulsar://localhost:6650
  service-urls:
    cns-qry: http://localhost:8083 # whose consent a request concerns, asked with the principal's own token
  dsr:
    # How long the answerer has, fixed at receipt (ADR-021) until regime profiles carry it (ADR-020): DPDPA Rules give
    # a grievance at most 90 days, and relayed requests are held to the same.
    deadline-days:
      relay: 90
      grievance: 90

resilience4j:
  # As in every service (#222): Spring Cloud CircuitBreaker's semaphore bulkhead set explicitly, so only the breaker
  # and the time limiter decide that cm-cns-qry-svc is down.
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 1000
        max-wait-duration: 0
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.techeazyhq.cm.reskit.RemoteFailures
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

management:
  observations:
    enable:
      # Spring Security observes every filter, authentication and authorization of every request, and nothing reads
      # them: no service exports metrics or traces. They were part of the 8% of df-reg's CPU spent on observations
      # (docs/security/vapt-and-performance.md). HTTP request metrics are kept.
      spring:
        security: false
  endpoints:
    web:
      exposure:
        include: health,info
