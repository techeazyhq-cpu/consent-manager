# The sandbox (ADR-034, ADR-037), on top of the docker profile (SPRING_PROFILES_ACTIVE=docker,sandbox): the same
# service with its own database (cm_sandbox), its own Keycloak realms (sbx-cm-*: own users, keys and issuers) and its
# own Pulsar tenant (CM_PULSAR_TENANT=cm-sbx, set in docker-compose.yml). Nothing here reaches production's data.

spring:
  data:
    redis:
      database: 1 # usage counters apart from production's (database 0)
  cloud:
    gateway:
      server:
        webflux:
          # The whole list, as a list can't be merged across profiles: only what the sandbox runs.
          routes:
            # An organisation taking all of its data takes longer than any other call, so it has its own route, and with it its
            # own circuit breaker and time limit (ADR-064): a slow export neither opens the circuit for df-reg nor is cut at 10 s.
            - id: df-reg-export
              uri: http://cm-sbx-df-reg-svc:8081
              predicates:
                - Path=/api/df-reg/me/export
            - id: df-reg
              uri: http://cm-sbx-df-reg-svc:8081
              predicates:
                - Path=/api/df-reg/**
            # A purpose drafted by the operator's own model takes longer than the 10 s of an ordinary call (ADR-111), so it has its own
            # route, and with it its own circuit breaker and time limit: a slow model neither opens the circuit for the rest of cns-cmd nor
            # is cut at 10 s.
            - id: cns-cmd-draft-assist
              uri: http://cm-sbx-cns-cmd-svc:8082
              predicates:
                - Path=/api/cns-cmd/prps-defs/draft-assist
            - id: cns-cmd
              uri: http://cm-sbx-cns-cmd-svc:8082
              predicates:
                - Path=/api/cns-cmd/**
            - id: cns-qry
              uri: http://cm-sbx-cns-qry-svc:8083
              predicates:
                - Path=/api/cns-qry/**
            - id: ntf
              uri: http://cm-sbx-ntf-svc:8084
              predicates:
                - Path=/api/ntf/**
            - id: bil
              uri: http://cm-sbx-bil-svc:8085
              predicates:
                - Path=/api/bil/**

cm:
  sandbox:
    enabled: true
  security:
    realm-prefix: sbx-
  pdp:
    base-url: http://sbx-opa:8181 # verifies consent tokens against the sandbox's own keys
  service-urls:
    df-reg: http://cm-sbx-df-reg-svc:8081 # checks API keys and signed requests (ADR-041)
    bil: http://cm-sbx-bil-svc:8085
