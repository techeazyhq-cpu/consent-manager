server:
  port: 9000
  http2:
    enabled: true

spring:
  application:
    name: cm-gw
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/cm-realm
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:
        - id: df-reg
          uri: http://localhost:8081
          predicates:
            - Path=/api/df-reg/**
        - id: cns-cmd
          uri: http://localhost:8082
          predicates:
            - Path=/api/cns-cmd/**
        - id: cns-qry
          uri: http://localhost:8083
          predicates:
            - Path=/api/cns-qry/**
        - id: ntf
          uri: http://localhost:8084
          predicates:
            - Path=/api/ntf/**
        - id: bil
          uri: http://localhost:8085
          predicates:
            - Path=/api/bil/**

cm:
  pdp:
    base-url: http://localhost:8181
  service-urls:
    bil: http://localhost:8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
