server:
  port: 9000
  http2:
    enabled: true

spring:
  application:
    name: cm-gw
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/cm-realm
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      # Every route gets its own circuit breaker, named after the route id (ADR-016). An unreachable, timed-out or
      # open-circuit service is answered 503 by RouteFallbackController; a response from the service, 5xx included,
      # passes through as it is, so a 503 a service gives for its own dependency doesn't open this one too.
      default-filters:
        - name: CircuitBreaker
          args:
            fallbackUri: forward:/fallback
      routes:
        - id: df-reg
          uri: http://localhost:8081
          predicates:
            - Path=/api/df-reg/**
        - id: cns-cmd
          uri: http://localhost:8082
          predicates:
            - Path=/api/cns-cmd/**
        - id: cns-qry
          uri: http://localhost:8083
          predicates:
            - Path=/api/cns-qry/**
        - id: ntf
          uri: http://localhost:8084
          predicates:
            - Path=/api/ntf/**
        - id: bil
          uri: http://localhost:8085
          predicates:
            - Path=/api/bil/**
        - id: aud
          uri: http://localhost:8086
          predicates:
            - Path=/api/aud/**

cm:
  pdp:
    base-url: http://localhost:8181
  service-urls:
    bil: http://localhost:8085

# Circuit breakers on calls to other services (ADR-016). One breaker per dependency: it opens when at least half of
# the last 20 calls failed because the dependency is unhealthy (cm-res-kit's RemoteFailures: unreachable, timed out,
# 5xx or 429; any other 4xx is the dependency working), refuses calls for 30s, then lets 3 trial calls through.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.techeazyhq.cm.reskit.RemoteFailures
  timelimiter:
    configs:
      default:
        # A route's whole request: longer than any one service's own budget for its dependencies.
        timeout-duration: 10s
    instances:
      # Calls the gateway makes itself on the request path, before routing.
      pdp:
        timeout-duration: 2s
      bil-quota:
        timeout-duration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
