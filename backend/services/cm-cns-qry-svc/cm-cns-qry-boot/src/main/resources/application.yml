server:
  port: 8083
  http2:
    enabled: true

spring:
  reactor:
    context-propagation: auto # the trace follows a request through the reactive chain (ADR-093)
  http:
    codecs:
      # Jackson 2, as the services' own code, until the move to Jackson 3 (#216)
      preferred-json-mapper: jackson2
  application:
    name: cm-cns-qry-svc
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/consent_manager?schema=cns_qry
    pool:
      # Wait at most 3 s for a connection, then fail, rather than queue until the gateway gives up at 10 s: under
      # overload a saturated pool held requests that long (docs/security/vapt-and-performance.md).
      max-acquire-time: 3s
    username: cm
    password: cm
  flyway:
    url: jdbc:postgresql://localhost:5432/consent_manager
    user: cm
    password: cm
    schemas: cns_qry
    default-schema: cns_qry
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

cm:
  pulsar:
    service-url: pulsar://localhost:6650
  cnsqry:
    # Single-consent lookups cached in Redis (#31), evicted by the projector's writes. The TTL bounds how long a read
    # racing a change can leave the old row; past the timeout, a read goes to PostgreSQL.
    cache:
      enabled: true
      ttl: PT1M
      timeout: PT0.2S

management:
  metrics:
    distribution:
      # buckets, for the dashboards' p95 and the SlowRequests alert (ADR-070)
      percentiles-histogram:
        http.server.requests: true
  observations:
    enable:
      # Spring Security observes every filter, authentication and authorization of every request, and nothing reads
      # them: no service exports traces (ADR-070 adds metrics, off unless CM_METRICS_EXPOSURE says so). They were part of the 8% of df-reg's CPU spent on observations
      # (docs/security/vapt-and-performance.md). HTTP request metrics are kept.
      spring:
        security: false
  # Traces (ADR-093): spans exist, but none is sampled unless CM_TRACING_SAMPLING (0 to 1) says so, and they go to an OTLP endpoint
  # (Tempo) that is only reached when something is sampled.
  tracing:
    sampling:
      probability: ${CM_TRACING_SAMPLING:0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${CM_TRACING_ENDPOINT:http://tempo:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: ${CM_METRICS_EXPOSURE:health,info}
  health:
    redis:
      # Only a cache here: the service answers from PostgreSQL without it, so Redis being down doesn't make it unready.
      enabled: false
