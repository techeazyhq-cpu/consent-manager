server:
  port: 8084
  http2:
    enabled: true

spring:
  cloud:
    circuitbreaker:
      resilience4j:
        # The notification-service client times out each attempt itself and retries (cm.ntf.notification-service);
        # a time limit on the whole send would cut its retries short.
        disable-time-limiter-map:
          notification-service: true
  application:
    name: cm-ntf-svc
  mail:
    host: localhost
    port: 1025 # Mailpit's SMTP port
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/consent_manager?schema=ntf
    pool:
      # Wait at most 3 s for a connection, then fail, rather than queue until the gateway gives up at 10 s: under
      # overload a saturated pool held requests that long (docs/security/vapt-and-performance.md).
      max-acquire-time: 3s
    username: cm
    password: cm
  flyway:
    url: jdbc:postgresql://localhost:5432/consent_manager
    user: cm
    password: cm
    schemas: ntf
    default-schema: ntf
    locations: classpath:db/migration

cm:
  pulsar:
    service-url: pulsar://localhost:6650
  ntf:
    from-address: no-reply@consent-manager.local
    # local: Mailpit + in-memory SMS/WhatsApp/push catchers (no other stack needed).
    # notification-service: every channel through https://github.com/techeazyhq-cpu/notification-service
    provider: ${CM_NTF_PROVIDER:local}
    notification-service:
      base-url: ${NTF_SVC_BASE_URL:http://localhost:18080}
      api-key: ${NTF_SVC_API_KEY:}
      signing-secret: ${NTF_SVC_SIGNING_SECRET:}
      from-address: ${NTF_SVC_FROM_ADDRESS:} # a sender verified in notification-service; empty = its default sender
      otp-validity-seconds: 300
      timeout: 5s
      max-retries: 3
      retry-backoff: 500ms
      # Send a push's data (cnsReqId, so a tap opens that request in the DP app). notification-service accepts it
      # from its push-data release; an older one ignores the field, and false leaves it out.
      push-data: ${NTF_SVC_PUSH_DATA:true}

# Circuit breakers on calls to other services (ADR-016). One breaker per dependency: it opens when at least half of
# the last 20 calls failed because the dependency is unhealthy (cm-res-kit's RemoteFailures: unreachable, timed out,
# 5xx or 429; any other 4xx is the dependency working), refuses calls for 30s, then lets 3 trial calls through.
resilience4j:
  # Spring Cloud CircuitBreaker also puts each call in a semaphore bulkhead, by default 25 calls at once with no wait;
  # past that a call fails as if the dependency were down (the VAPT found API-key requests refused with 503 from 30 at
  # once). The time limiter and the breaker already guard against a slow dependency; this only bounds a runaway.
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 1000
        max-wait-duration: 0
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.techeazyhq.cm.reskit.RemoteFailures
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info
