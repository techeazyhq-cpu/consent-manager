server:
  port: 8082
  http2:
    enabled: true

spring:
  application:
    name: cm-cns-cmd-svc
  # Batches (ADR-036): a JSON list of 10,000 recipients is well over the 256 KB default; uploads are at most 5 MB.
  codec:
    max-in-memory-size: 4MB
  webflux:
    multipart:
      max-in-memory-size: 1MB
      max-disk-usage-per-part: 6MB
      max-parts: 16
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/consent_manager?schema=cns_cmd
    pool:
      # Wait at most 3 s for a connection, then fail, rather than queue until the gateway gives up at 10 s: under
      # overload a saturated pool held requests that long (docs/security/vapt-and-performance.md).
      max-acquire-time: 3s
    username: cm
    password: cm
  flyway:
    url: jdbc:postgresql://localhost:5432/consent_manager
    user: cm
    password: cm
    schemas: cns_cmd
    default-schema: cns_cmd
    locations: classpath:db/migration

cm:
  pulsar:
    service-url: pulsar://localhost:6650
  service-urls:
    df-reg: http://localhost:8081
    bil: http://localhost:8085
  cnscmd:
    expiry-sweep:
      fixed-delay-ms: 60000
    # Seals secrets this service keeps, such as webhook signing secrets (ADR-047): base64 of 32 bytes. A development
    # key here; production sets CM_CNSCMD_SECRETS_KEY from the cloud's key management.
    secrets-key: ${CM_CNSCMD_SECRETS_KEY:Y25zLWNtZC1sb2NhbC1kZXYtb25seS1zZWNyZXRzLWs=}
  ntf:
    obx-relay:
      fixed-delay-ms: 1000
  # Consent token signing keys (ADR-006): a JSON Web Key Set file, created on first start when allowed.
  # Production: mount a managed key set there and set CM_CNS_TKN_CREATE_KEYS=false.
  cns-tkn:
    keys-path: ${CM_CNS_TKN_KEYS_PATH:build/cns-tkn-keys/jwks.json}
    create-keys-if-missing: ${CM_CNS_TKN_CREATE_KEYS:true}
    # How long a consent token lives (ADR-027): the longest an offline verifier can keep honouring a withdrawn consent.
    # Never longer than the consent itself. Interim setting until regime profiles (ADR-020) supply it per law and purpose.
    lifetime: ${CM_CNS_TKN_LIFETIME:PT15M}
  # Consent receipts (ADR-025): signed with their own key set, never the token keys. Retired keys stay in the set,
  # after the current one, and stay published, so every receipt kept can still be verified.
  cns-rcpt:
    keys-path: ${CM_CNS_RCPT_KEYS_PATH:build/cns-rcpt-keys/receipt-jwks.json}
    create-keys-if-missing: ${CM_CNS_RCPT_CREATE_KEYS:true}
  # Fiduciary webhooks (ADR-047). Private and loopback addresses are refused as endpoints (SSRF) unless allowed here,
  # for local development only; retry-delays overrides the delivery schedule (comma-separated ISO durations).
  webhooks:
    allow-private: ${CM_WEBHOOKS_ALLOW_PRIVATE:false}
    retry-delays: ${CM_WEBHOOKS_RETRY_DELAYS:}
  # What every consent record says about the platform itself (ADR-023, ADR-025)
  platform:
    name: ${CM_PLATFORM_NAME:Consent Manager}
    jurisdiction: ${CM_CELL_JURISDICTION:IN}
    grievance-contact: ${CM_PLATFORM_GRIEVANCE_CONTACT:grievance@consent-manager.example}
    withdrawal-url: ${CM_PLATFORM_WITHDRAWAL_URL:http://localhost:5174/#/consents}

# Circuit breakers on calls to other services (ADR-016). One breaker per dependency: it opens when at least half of
# the last 20 calls failed because the dependency is unhealthy (cm-res-kit's RemoteFailures: unreachable, timed out,
# 5xx or 429; any other 4xx is the dependency working), refuses calls for 30s, then lets 3 trial calls through.
resilience4j:
  # Spring Cloud CircuitBreaker also puts each call in a semaphore bulkhead, by default 25 calls at once with no wait;
  # past that a call fails as if the dependency were down (the VAPT found API-key requests refused with 503 from 30 at
  # once). The time limiter and the breaker already guard against a slow dependency; this only bounds a runaway.
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 1000
        max-wait-duration: 0
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.techeazyhq.cm.reskit.RemoteFailures
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info