# Consent Manager's sign-in pages. Built on Keycloak's unstyled base theme rather than the PatternFly one, so the
# markup and CSS are ours. The audience themes (cm-dp, cm-df, cm-admin) inherit everything and change only
# cmAudience and the audience messages; cm-base itself is the realm default (account console, unthemed clients).
parent=base
styles=css/cm-login.css
meta=viewport==width=device-width,initial-scale=1

# Selects the accent colour in cm-login.css (body[data-audience]).
cmAudience=cm

# Classes for the pages inherited from base (error, info, logout, page expired) and the cm-idn-otp-spi forms.
kcFormClass=cm-form
kcFormGroupClass=cm-field
kcLabelClass=cm-label
kcInputClass=cm-input
kcInputHelperTextBeforeClass=cm-help
kcInputErrorMessageClass=cm-field-error
kcFormButtonsClass=cm-actions
kcFormOptionsClass=cm-actions
kcButtonClass=cm-button
kcButtonPrimaryClass=cm-button-primary
kcButtonDefaultClass=cm-button-secondary
kcButtonBlockClass=cm-button-block
kcAlertClass=cm-alert
kcAlertTitleClass=cm-alert-text
